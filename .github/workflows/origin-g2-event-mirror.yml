name: Origin G2 event mirror

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Poll ntfy and append to tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NTFY_TOPIC: ${{ secrets.ORIGIN_G2_NTFY_TOPIC }}
          ISSUE_NUMBER: "2"
        run: |
          set -euo pipefail
          if [ -z "${NTFY_TOPIC}" ]; then
            echo "ORIGIN_G2_NTFY_TOPIC secret missing"
            exit 1
          fi
          curl -fsSL "https://ntfy.sh/${NTFY_TOPIC}/json?poll=1&since=20m" -o /tmp/ntfy.json || true
          if [ ! -s /tmp/ntfy.json ]; then
            echo "no messages"
            exit 0
          fi
          python3 <<'PY'
          import json, os, subprocess, pathlib, datetime
          raw = pathlib.Path("/tmp/ntfy.json").read_text(encoding="utf-8").strip()
          if not raw:
              raise SystemExit(0)
          msgs = []
          if "\n" in raw:
              for line in raw.splitlines():
                  line = line.strip()
                  if line:
                      msgs.append(json.loads(line))
          else:
              obj = json.loads(raw)
              msgs = obj if isinstance(obj, list) else [obj]

          issue = os.environ["ISSUE_NUMBER"]
          existing = subprocess.check_output(
              ["gh", "api", f"repos/uridolan77/origin-probe/issues/{issue}/comments?per_page=100"],
              text=True,
          )
          existing_ids = set()
          for c in json.loads(existing):
              body = c.get("body") or ""
              if "ntfyId" in body:
                  try:
                      # naive extract
                      for token in body.replace("\n", " ").split():
                          if token.startswith('"') and token.endswith('",'):
                              pass
                      if '"ntfyId"' in body:
                          start = body.index('"ntfyId"')
                          frag = body[start:start+80]
                          for part in frag.split('"'):
                              if part and part not in ("ntfyId", ": ", ", ", " ", ":") and len(part) > 5 and part[0].isalnum():
                                  existing_ids.add(part)
                                  break
                  except Exception:
                      pass

          for m in msgs:
              if m.get("event") != "message":
                  continue
              mid = m.get("id") or ""
              if mid and mid in existing_ids:
                  print("skip duplicate", mid)
                  continue
              envelope = {
                  "ingestedAtUtc": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                  "runId": "ORIGIN-G2-PUBLIC-PROBE-AUTH-001",
                  "sink": "ntfy.sh",
                  "ntfyId": mid,
                  "message": m.get("message"),
              }
              body = "```json\n" + json.dumps(envelope, indent=2) + "\n```\n"
              subprocess.check_call(
                  [
                      "gh",
                      "api",
                      f"repos/uridolan77/origin-probe/issues/{issue}/comments",
                      "-f",
                      f"body={body}",
                  ]
              )
              print("mirrored", mid)
          PY
