name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: origin_measure_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d origin_measure_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MEASUREMENT_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/origin_measure_test
    steps:
      - uses: actions/checkout@v4
      - name: Record committed OG digests
        run: sha256sum public/og/*.png
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm ci --prefix measurement
      - run: npm test --prefix measurement
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run guard:all
      - name: Ensure OG font
        run: |
          sudo apt-get update -y
          sudo apt-get install -y fonts-liberation
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  verify-windows:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run guard:all
      - run: npm run build
