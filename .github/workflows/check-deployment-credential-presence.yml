name: check-origin-deployment-credential-presence

on:
  push:
    branches:
      - deploy/origin-canonical-artifact-001

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN_VALUE: ${{ secrets.VERCEL_TOKEN }}
      GODADDY_KEY_VALUE: ${{ secrets.GODADDY_API_KEY }}
      GODADDY_SECRET_VALUE: ${{ secrets.GODADDY_API_SECRET }}
    steps:
      - name: Report presence only
        run: |
          set -eu
          present() {
            if [ -n "$1" ]; then printf 'true'; else printf 'false'; fi
          }
          printf 'VERCEL_TOKEN_PRESENT=%s\n' "$(present "$VERCEL_TOKEN_VALUE")"
          printf 'GODADDY_API_KEY_PRESENT=%s\n' "$(present "$GODADDY_KEY_VALUE")"
          printf 'GODADDY_API_SECRET_PRESENT=%s\n' "$(present "$GODADDY_SECRET_VALUE")"
