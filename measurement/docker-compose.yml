services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: origin
      POSTGRES_PASSWORD: origin_measure_dev
      POSTGRES_DB: origin_measure
    volumes:
      - origin_measure_pg:/var/lib/postgresql/data
      - ./sql/schema_v1.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U origin -d origin_measure"]
      interval: 2s
      timeout: 5s
      retries: 20

  api-a:
    build: .
    environment:
      MEASUREMENT_DATABASE_URL: postgres://origin:origin_measure_dev@db:5432/origin_measure
      MEASUREMENT_HMAC_SECRET: ${MEASUREMENT_HMAC_SECRET}
      MEASUREMENT_CLIENT_SALT: ${MEASUREMENT_CLIENT_SALT}
      MEASUREMENT_ADMIN_KEY: ${MEASUREMENT_ADMIN_KEY}
      MEASUREMENT_ALLOWED_ORIGIN: ${MEASUREMENT_ALLOWED_ORIGIN:-https://uridolan77.github.io}
      MEASUREMENT_RUN_ID: ${MEASUREMENT_RUN_ID:-ORIGIN-G2R-ACCEPTANCE}
      MEASUREMENT_OPERATOR_HASHES: ${MEASUREMENT_OPERATOR_HASHES:-}
      MEASUREMENT_REQUIRE_SECRETS: "true"
      MEASUREMENT_INSTANCE_LABEL: api-a
      PORT: "8787"
    ports:
      - "8787:8787"
    depends_on:
      db:
        condition: service_healthy

  api-b:
    build: .
    environment:
      MEASUREMENT_DATABASE_URL: postgres://origin:origin_measure_dev@db:5432/origin_measure
      MEASUREMENT_HMAC_SECRET: ${MEASUREMENT_HMAC_SECRET}
      MEASUREMENT_CLIENT_SALT: ${MEASUREMENT_CLIENT_SALT}
      MEASUREMENT_ADMIN_KEY: ${MEASUREMENT_ADMIN_KEY}
      MEASUREMENT_ALLOWED_ORIGIN: ${MEASUREMENT_ALLOWED_ORIGIN:-https://uridolan77.github.io}
      MEASUREMENT_RUN_ID: ${MEASUREMENT_RUN_ID:-ORIGIN-G2R-ACCEPTANCE}
      MEASUREMENT_OPERATOR_HASHES: ${MEASUREMENT_OPERATOR_HASHES:-}
      MEASUREMENT_REQUIRE_SECRETS: "true"
      MEASUREMENT_INSTANCE_LABEL: api-b
      PORT: "8787"
    ports:
      - "8788:8787"
    depends_on:
      db:
        condition: service_healthy

volumes:
  origin_measure_pg:
